<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Bright Coastal Rounded Box -->
  <rect width="512" height="512" rx="128" fill="url(#oceanGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="110" stroke="rgba(255,255,255,0.4)" stroke-width="12" />

  <!-- Bold Unmistakable Letter 'R' -->
  <!-- R Stem -->
  <rect x="80" y="110" width="48" height="292" rx="14" fill="#FFFFFF" />
  <!-- R Loop -->
  <path
    d="M100 110 H200 C254 110, 280 138, 280 188 C280 238, 254 266, 200 266 H100 V110 Z M160 162 V214 H196 C220 214, 230 204, 230 188 C230 172, 220 162, 196 162 H160 Z"
    fill="#FFFFFF"
  />
  <!-- R Diagonal Leg -->
  <polygon points="170,248 230,248 290,402 230,402" fill="#FFF9D4" />

  <!-- Bold Unmistakable Letter 'A' -->
  <!-- A Left Leg -->
  <polygon points="360,110 404,110 324,402 274,402" fill="#FFFFFF" />
  <!-- A Right Leg -->
  <polygon points="360,110 404,110 484,402 434,402" fill="#FFFFFF" />
  <!-- A Crossbar -->
  <rect x="306" y="280" width="146" height="42" rx="10" fill="#FFF9D4" />
</svg>